<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Hassan Rana</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background-color: #0d0f10; color: #ece9e1;
        font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-image:
          linear-gradient(to right, rgb(236 233 225 / 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(236 233 225 / 0.045) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      main { max-width: 34rem; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #8a8f8b; }
      .code span { color: #c5f04a; }
      h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(2.5rem, 7vw, 4rem); line-height: 1; margin: 20px 0 16px; }
      h1 em { color: #c5f04a; }
      p { color: #b2b5b0; line-height: 1.6; }
      a.btn { display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 999px; background: #c5f04a; color: #0d0f10; text-decoration: none; font-weight: 500; font-size: 14px; }
      a.btn:hover { background: #d9f78a; }
      a:focus-visible { outline: 2px solid #c5f04a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code"><span>404</span> · route not found</p>
      <h1>This road <em>doesn’t lead anywhere.</em></h1>
      <p>The page you were looking for doesn’t exist or has moved.</p>
      <a class="btn" href="/">Back to the homepage</a>
    </main>
  </body>
</html>
